  <!-- CORE JAVASCRIPT ENGINE -->
  <script>
    // --- ROTATING XOR + BASE64 ENGINE ---
    function encodeStringToTable(str, key) {
      const utf8Str = unescape(encodeURIComponent(str));
      let out = '';
      for (let i = 0; i < utf8Str.length; i++) {
        out += String.fromCharCode(utf8Str.charCodeAt(i) ^ (key ^ (i % 11)));
      }
      return btoa(out);
    }

    function obfuscateWorkerCode(code, key = 0x4f) {
      const stringTable = [];
      const stringIndexMap = new Map();

      function getOrAddString(strContent) {
        if (stringIndexMap.has(strContent)) return stringIndexMap.get(strContent);
        const idx = stringTable.length;
        stringTable.push(encodeStringToTable(strContent, key));
        stringIndexMap.set(strContent, idx);
        return idx;
      }

      let i = 0;
      const len = code.length;
      let output = '';

      while (i < len) {
        const char = code[i];
        const nextChar = i + 1 < len ? code[i + 1] : '';

        // Single-line comments //
        if (char === '/' && nextChar === '/') {
          const end = code.indexOf('\n', i);
          if (end === -1) { output += code.slice(i); break; }
          output += code.slice(i, end);
          i = end;
          continue;
        }

        // Multi-line comments /* ... */
        if (char === '/' && nextChar === '*') {
          const end = code.indexOf('*/', i + 2);
          if (end === -1) { output += code.slice(i); break; }
          output += code.slice(i, end + 2);
          i = end + 2;
          continue;
        }

        // Template literals (`...`)
        if (char === '`') {
          let end = i + 1;
          while (end < len) {
            if (code[end] === '\\') end += 2;
            else if (code[end] === '`') { end++; break; }
            else end++;
          }
          output += code.slice(i, end);
          i = end;
          continue;
        }

        // Regular Expressions
        if (char === '/') {
          const trimmed = output.trimEnd();
          const lastChar = trimmed.slice(-1);
          const isRegex = !lastChar || '(=:[,!&|?;{}~^+*%-'.includes(lastChar) || /(?:return|case|delete|throw|typeof)\s*$/.test(trimmed);

          if (isRegex) {
            let end = i + 1;
            let inClass = false;
            while (end < len) {
              if (code[end] === '\\') end += 2;
              else if (code[end] === '[' && !inClass) { inClass = true; end++; }
              else if (code[end] === ']' && inClass) { inClass = false; end++; }
              else if (code[end] === '/' && !inClass) {
                end++;
                while (end < len && /[gimsuy]/.test(code[end])) end++;
                break;
              } else end++;
            }
            output += code.slice(i, end);
            i = end;
            continue;
          }
        }

        // Strings ('...' or "...")
        if (char === '"' || char === "'") {
          const quote = char;
          const strStart = i;
          let strEnd = i + 1;

          while (strEnd < len) {
            if (code[strEnd] === '\\') strEnd += 2;
            else if (code[strEnd] === quote) { strEnd++; break; }
            else if (code[strEnd] === '\n') break;
            else strEnd++;
          }

          const strLiteral = code.slice(strStart, strEnd);
          let rawVal = null;
          try {
            rawVal = quote === '"'
              ? JSON.parse(strLiteral)
              : JSON.parse(`"${strLiteral.slice(1, -1).replace(/\\'/g, "'").replace(/"/g, '\\"')}"`);
          } catch {
            rawVal = strLiteral.slice(1, -1);
          }

          const prevTrimmed = output.trimEnd();
          const isImportExport = /(?:from|import)\s*$/.test(prevTrimmed);
          const isDirective = rawVal === 'use strict';

          if (isImportExport || isDirective || !rawVal || rawVal.length === 0) {
            output += strLiteral;
            i = strEnd;
            continue;
          }

          let k = strEnd;
          while (k < len && (code[k] === ' ' || code[k] === '\t' || code[k] === '\r' || code[k] === '\n')) k++;
          const isFollowedByColon = (code[k] === ':' && code[k + 1] !== ':');
          const lastToken = prevTrimmed.slice(-1);
          const isTernaryOrCondition = lastToken === '?' || /(?:case)\s*$/.test(prevTrimmed);

          if (isFollowedByColon && !isTernaryOrCondition) {
            output += strLiteral;
          } else {
            const idx = getOrAddString(rawVal);
            output += `func_dec(${idx})`;
          }

          i = strEnd;
          continue;
        }

        output += char;
        i++;
      }

      const runtimeHeader = `// @ts-nocheck
const _0x_key = ${key};
const _0x_tbl = ${JSON.stringify(stringTable)};
const _0x_cache = new Map();
function func_dec(idx) {
  if (_0x_cache.has(idx)) return _0x_cache.get(idx);
  const raw = atob(_0x_tbl[idx]);
  let out = "";
  for (let i = 0; i < raw.length; i++) {
    out += String.fromCharCode(raw.charCodeAt(i) ^ (_0x_key ^ (i % 11)));
  }
  try {
    out = decodeURIComponent(escape(out));
  } catch (_) {}
  _0x_cache.set(idx, out);
  return out;
}
`;
      return {
        code: runtimeHeader + '\n' + output,
        stringCount: stringTable.length
      };
    }

    // --- DOM & FILE CONTROLLERS ---
    const sourceInput = document.getElementById('sourceCodeInput');
    const obfuscatedOutput = document.getElementById('obfuscatedOutput');
    const inputCharCount = document.getElementById('inputCharCount');
    const outputCharCount = document.getElementById('outputCharCount');
    const inputFileNameDisplay = document.getElementById('inputFileNameDisplay');
    const outputFileNameDisplay = document.getElementById('outputFileNameDisplay');
    const metricStringsCount = document.getElementById('metricStringsCount');
    const metricTime = document.getElementById('metricTime');
    const metricSizeDelta = document.getElementById('metricSizeDelta');
    const outputStatusLabel = document.getElementById('outputStatusLabel');
    const xorKeyInput = document.getElementById('xorKeyInput');
    const toastNotification = document.getElementById('toastNotification');
    const dropZone = document.getElementById('dropZone');
    const fileUploadInput = document.getElementById('fileUploadInput');

    // Dynamic file naming state
    let currentInputFileName = 'source.js';
    let currentOutputFileName = 'cloak.obfuscated.js';

    function computeObfuscatedName(originalName) {
      if (!originalName) return 'cloak.obfuscated.js';
      const lastDot = originalName.lastIndexOf('.');
      if (lastDot > 0) {
        const base = originalName.slice(0, lastDot);
        return `${base}.obfuscated.js`;
      }
      return `${originalName}.obfuscated.js`;
    }

    function handleFileSelection(file) {
      if (!file) return;
      currentInputFileName = file.name;
      currentOutputFileName = computeObfuscatedName(file.name);

      if (inputFileNameDisplay) inputFileNameDisplay.innerText = currentInputFileName;
      if (outputFileNameDisplay) outputFileNameDisplay.innerText = currentOutputFileName;

      const reader = new FileReader();
      reader.onload = (event) => {
        sourceInput.value = event.target.result;
        updateInputCounters();
        showToast(`Loaded ${file.name}`);
      };
      reader.readAsText(file);
    }

    function showToast(text, isError = false) {
      toastNotification.innerHTML = isError
        ? `<span class="text-rose-400">✕</span> <span>${text}</span>`
        : `<span class="text-brandEmerald">✓</span> <span>${text}</span>`;
      toastNotification.className = isError
        ? 'fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-xs font-mono bg-oledCard border border-rose-500/40 text-rose-200'
        : 'fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-xs font-mono bg-oledCard border border-indigo-500/40 text-slate-100';

      setTimeout(() => {
        toastNotification.className = 'fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-xs font-mono bg-oledCard border border-oledBorder text-slate-100';
      }, 3000);
    }

    function updateInputCounters() {
      const len = sourceInput.value.length;
      inputCharCount.innerText = `${len.toLocaleString()} chars`;
    }

    sourceInput.addEventListener('input', updateInputCounters);

    // Ctrl+Enter or Cmd+Enter shortcut
    sourceInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runObfuscation();
      }
    });

    // Drag and drop support
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-brandIndigo', 'bg-oledCard/60');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-brandIndigo', 'bg-oledCard/60');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const file = dt && dt.files[0];
      if (file) {
        handleFileSelection(file);
      }
    });

    // File Upload Input
    fileUploadInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        handleFileSelection(file);
      }
    });

    document.getElementById('randomKeyBtn').addEventListener('click', () => {
      const hex = '0x' + Math.floor(Math.random() * 255).toString(16).toUpperCase().padStart(2, '0');
      xorKeyInput.value = hex;
      showToast(`Key updated to ${hex}`);
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      sourceInput.value = '';
      obfuscatedOutput.value = '';
      currentInputFileName = 'source.js';
      currentOutputFileName = 'cloak.obfuscated.js';
      if (inputFileNameDisplay) inputFileNameDisplay.innerText = 'source.js';
      if (outputFileNameDisplay) outputFileNameDisplay.innerText = 'cloak.obfuscated.js';
      fileUploadInput.value = '';
      updateInputCounters();
      outputCharCount.innerText = '0 chars';
      metricStringsCount.innerText = '0';
      metricTime.innerText = '—';
      metricSizeDelta.innerText = '0.00';
      outputStatusLabel.innerText = 'Idle';
      outputStatusLabel.className = 'text-indigo-400 font-semibold';
      showToast('Workspace cleared');
    });

    function runObfuscation() {
      const code = sourceInput.value.trim();
      if (!code) {
        showToast('Please enter or paste JavaScript source code', true);
        return;
      }

      let parsedKey = parseInt(xorKeyInput.value.trim(), 16);
      if (isNaN(parsedKey)) parsedKey = parseInt(xorKeyInput.value.trim(), 10);
      if (isNaN(parsedKey)) parsedKey = 0x4f;

      const start = performance.now();
      try {
        const result = obfuscateWorkerCode(code, parsedKey);
        const duration = (performance.now() - start).toFixed(1);

        obfuscatedOutput.value = result.code;
        outputCharCount.innerText = `${result.code.length.toLocaleString()} chars`;
        metricStringsCount.innerText = result.stringCount.toLocaleString();
        metricTime.innerText = duration;

        const sizeDelta = ((result.code.length - code.length) / 1024).toFixed(2);
        metricSizeDelta.innerText = (sizeDelta >= 0 ? `+${sizeDelta}` : sizeDelta);

        outputStatusLabel.innerText = 'Obfuscated';
        outputStatusLabel.className = 'text-brandEmerald font-semibold';

        showToast(`Protected ${result.stringCount} strings in ${duration}ms`);
      } catch (err) {
        showToast(`Error: ${err.message}`, true);
      }
    }

    // Run Obfuscation Button
    document.getElementById('obfuscateActionBtn').addEventListener('click', runObfuscation);

    // Copy to Clipboard
    document.getElementById('copyOutputBtn').addEventListener('click', () => {
      const output = obfuscatedOutput.value;
      if (!output) {
        showToast('No obfuscated code to copy', true);
        return;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(output).then(() => {
          showToast('Copied to clipboard');
        }).catch(() => fallbackCopy(output));
      } else {
        fallbackCopy(output);
      }
    });

    function fallbackCopy(text) {
      obfuscatedOutput.select();
      try {
        document.execCommand('copy');
        showToast('Copied to clipboard');
      } catch {
        showToast('Copy failed', true);
      }
    }

    // Download File with Dynamic Name
    document.getElementById('downloadOutputBtn').addEventListener('click', () => {
      const output = obfuscatedOutput.value;
      if (!output) {
        showToast('No code available to download', true);
        return;
      }
      const blob = new Blob([output], { type: 'application/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentOutputFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${currentOutputFileName}`);
    });
  </script>
</body>
</html>
